name: danaseq-amplicon-python
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.10
  - cutadapt
  - mafft
  - fasttree
  - biopython
  - scikit-learn
  - matplotlib
  - scipy
  - numpy
  - pip
  - pip:
    # Pinned, and bumped deliberately — papa2 does the denoising, so its commit
    # decides what the numbers are.
    - git+https://github.com/rec3141/papa2.git@fd3cb5aa56898cb7ae73e1674ac19453057f6141
