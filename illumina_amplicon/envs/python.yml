name: danaseq-amplicon-python
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.10
  - cutadapt
  - mafft
  - fasttree
  - vsearch                 # EarthDNA globe placement (PLACE_GLOBE)
  - biopython
  - scikit-learn
  - matplotlib
  - scipy
  - numpy
  - pandas
  - pip
  - pip:
    # Pinned, and bumped deliberately — papa2 does the denoising, so its commit
    # decides what the numbers are.
    - git+https://github.com/rec3141/papa2.git@v1.0.1
