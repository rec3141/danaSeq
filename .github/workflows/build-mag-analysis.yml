name: Build mag_analysis image

on:
  push:
    branches: [main]
    paths:
      - 'mag_analysis/**'
      - '!mag_analysis/conda-envs/**'
      - '!mag_analysis/envs/**'
      - '!mag_analysis/Dockerfile.base-slim'
      - '.github/workflows/build-mag-analysis.yml'
      - 'tools/microscape_deploy.sh'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Two variants from the same Dockerfile: the gpu one sits on the base built
  # with CUDA PyTorch (build-base-slim.yml).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: danaseq-mag-analysis
            base: danaseq-mag-base-slim
          - image: danaseq-mag-analysis-gpu
            base: danaseq-mag-base-slim-gpu
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/${{ matrix.image }}
    outputs:
      build_date: ${{ steps.stamp.outputs.build_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ github.sha }}

      - name: Stamp build time
        id: stamp
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The image is built from mag_analysis/ alone; viz/deploy.sh (the
      # microscape.app deploy hook's target) needs the shared deployer beside it.
      - name: Stage shared deploy tool
        run: cp tools/microscape_deploy.sh mag_analysis/viz/microscape_deploy.sh

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: mag_analysis
          file: mag_analysis/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image so a run launched from the .sif can report what
          # it is. The image tag already carries the SHA, but nothing inside can
          # read it — without these the Dockerfile's ARG defaults win and every
          # run records commit_id "unknown".
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.base }}:latest
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}

      # Nextflow compiles the pipeline only when it parses it, so without this a
      # Groovy syntax error would first surface on a cluster, after a node
      # allocation, in an image the clusters had already auto-pulled. The image's
      # default CMD is `run /pipeline/main.nf --help`, so this is the whole
      # check. Production sets the legacy parser; match it or the test passes on
      # a grammar the runs do not use.
      - name: Smoke test - the pipeline compiles
        run: |
          docker run --rm -e NXF_SYNTAX_PARSER=v1 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      # Only now does :latest move. A failed smoke test leaves it on the last
      # image that passed, rather than on one that cannot start.
      - name: Promote to latest
        run: |
          src="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker buildx imagetools create -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" "$src"

  # A matrix job cannot hand each leg's digest to the next job, so read both
  # promoted digests back from the registry.
  # A variant whose leg failed is left empty and not published, so a broken
  # gpu build never holds back the cpu image.
  digests:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      cpu: ${{ steps.inspect.outputs.cpu }}
      gpu: ${{ steps.inspect.outputs.gpu }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: inspect
        run: |
          for v in cpu gpu; do
            img=danaseq-mag-analysis; [ $v = gpu ] && img=danaseq-mag-analysis-gpu
            if d=$(docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ github.repository_owner }}/$img:${{ github.sha }}" --format '{{.Manifest.Digest}}'); then
              echo "$v=$d" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::$img:${{ github.sha }} was not built; not publishing it"
            fi
          done

  # A ready-made SIF of the promoted image and the deploy record that pins
  # the clusters to it. See publish-sif.yml for the permissions it needs.
  publish:
    needs: [build, digests]
    if: ${{ !cancelled() && needs.digests.outputs.cpu != '' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-sif.yml
    with:
      image: danaseq-mag-analysis
      digest: ${{ needs.digests.outputs.cpu }}
      build_date: ${{ needs.build.outputs.build_date }}

  # After the cpu record, not beside it: both push to deploy/ on main.
  publish-gpu:
    needs: [build, digests, publish]
    if: ${{ !cancelled() && needs.digests.outputs.gpu != '' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-sif.yml
    with:
      image: danaseq-mag-analysis-gpu
      digest: ${{ needs.digests.outputs.gpu }}
      build_date: ${{ needs.build.outputs.build_date }}
