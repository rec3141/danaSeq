name: Build mag_analysis image

on:
  push:
    branches: [main]
    paths:
      - 'mag_analysis/**'
      - '!mag_analysis/conda-envs/**'
      - '!mag_analysis/envs/**'
      - '!mag_analysis/Dockerfile.base-slim'
      - '.github/workflows/build-mag-analysis.yml'
      - 'tools/microscape_deploy.sh'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/danaseq-mag-analysis

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.promote.outputs.digest }}
      build_date: ${{ steps.stamp.outputs.build_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ github.sha }}

      - name: Stamp build time
        id: stamp
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The image is built from mag_analysis/ alone; viz/deploy.sh (the
      # microscape.app deploy hook's target) needs the shared deployer beside it.
      - name: Stage shared deploy tool
        run: cp tools/microscape_deploy.sh mag_analysis/viz/microscape_deploy.sh

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: mag_analysis
          file: mag_analysis/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image so a run launched from the .sif can report what
          # it is. The image tag already carries the SHA, but nothing inside can
          # read it — without these the Dockerfile's ARG defaults win and every
          # run records commit_id "unknown".
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}

      # Nextflow compiles the pipeline only when it parses it, so without this a
      # Groovy syntax error would first surface on a cluster, after a node
      # allocation, in an image the clusters had already auto-pulled. The image's
      # default CMD is `run /pipeline/main.nf --help`, so this is the whole
      # check. Production sets the legacy parser; match it or the test passes on
      # a grammar the runs do not use.
      - name: Smoke test - the pipeline compiles
        run: |
          docker run --rm -e NXF_SYNTAX_PARSER=v1 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      # Only now does :latest move. A failed smoke test leaves it on the last
      # image that passed, rather than on one that cannot start.
      - name: Promote to latest
        id: promote
        run: |
          src="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker buildx imagetools create -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" "$src"
          echo "digest=$(docker buildx imagetools inspect "$src" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

  # A ready-made SIF of the promoted image, published to GHCR as an ORAS
  # artifact beside it (tag sif-<sha>). Clusters then download the SIF instead
  # of each converting the image with mksquashfs, which on grex is killed: it
  # sizes its caches from the node's memory, not the job's limit. Its own
  # runner, because unpacking and squashing the image needs more disk than the
  # build job has left.
  sif:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      # A failure here must not block the deploy record: without SIF fields
      # the clusters fall back to building from the image.
      - name: Build and push SIF
        id: sif
        continue-on-error: true
        run: |
          apptainer build image.sif "docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}"
          sha=$(sha256sum image.sif | cut -d' ' -f1)
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
              --username "${{ github.actor }}" --password-stdin oras://${{ env.REGISTRY }}
          ref="oras://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sif-${{ github.sha }}"
          apptainer push image.sif "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          ls -la image.sif

      # The deployable digest (and SIF), in version control; omc-pickup pins
      # each cluster to it rather than resolving :latest mid-publish.
      - name: Record deployed digest
        env:
          SIF_REF: ${{ steps.sif.outputs.ref }}
          SIF_SHA256: ${{ steps.sif.outputs.sha256 }}
        run: >
          bash .github/scripts/record-deploy.sh danaseq-mag-analysis
          "${{ needs.build.outputs.digest }}"
          ""
          "${{ needs.build.outputs.build_date }}"
