name: Build assembly base image

on:
  # Editing Dockerfile.base or the env specs used to trigger only the leaf
  # builds (they match nanopore_assembly/**), which rebuild a thin layer on top
  # of an unchanged base — so the edit published a new :latest that did not
  # contain it. A Flye pin bump shipped that way on 2026-09-20.
  push:
    branches: [main]
    paths:
      - 'nanopore_assembly/Dockerfile.base'
      - 'nanopore_assembly/envs/**'
      - '.github/workflows/build-assembly-base.yml'
  workflow_dispatch:

# One build of an image at a time, in the order they were queued. A commit that
# touches Dockerfile.base and a leaf together queues the leaf's own push build
# and, once the base finishes, the base's rebuild of that leaf — both pushing
# :latest. Without this the tag is whichever finished last, and the push build
# is the faster of the two, so the stale one can win.
concurrency:
  group: image-danaseq-assembly-base
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/danaseq-assembly-base

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Maximize build disk space
        uses: easimon/maximize-build-space@v10
        with:
          build-mount-path: /var/lib/docker
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Restart Docker daemon
        run: sudo systemctl restart docker

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: nanopore_assembly
          file: nanopore_assembly/Dockerfile.base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # These three rebuild over the base this run just published. Each one also
  # runs on its own push, potentially over the previous base, so each re-checks
  # the base digest before promoting :latest and stands down if it moved. The
  # chained run below is the one that promotes.
  nanopore-assembly:
    needs: build
    permissions:
      # write, not read: the called workflow records the promoted digest to
      # deploy/<image>.json. A called workflow cannot hold more permission than
      # its caller grants, and granting less fails the whole run at startup.
      contents: write
      packages: write
    uses: ./.github/workflows/build-nanopore-assembly.yml

  illumina-assembly:
    needs: build
    permissions:
      # write, not read: the called workflow records the promoted digest to
      # deploy/<image>.json. A called workflow cannot hold more permission than
      # its caller grants, and granting less fails the whole run at startup.
      contents: write
      packages: write
    uses: ./.github/workflows/build-illumina-assembly.yml

  illumina-rna:
    needs: build
    permissions:
      # write, not read: the called workflow records the promoted digest to
      # deploy/<image>.json. A called workflow cannot hold more permission than
      # its caller grants, and granting less fails the whole run at startup.
      contents: write
      packages: write
    uses: ./.github/workflows/build-illumina-rna.yml
