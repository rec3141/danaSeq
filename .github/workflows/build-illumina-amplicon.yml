name: Build illumina_amplicon image

on:
  push:
    branches: [main]
    paths:
      - 'illumina_amplicon/**'
      # envs/ IS a build input here: python.yml pins papa2 by SHA, so an env
      # change must rebuild. Prose lives in the site's docs/, not in the stage.
      - '!illumina_amplicon/README.md'
      - '.github/workflows/build-illumina-amplicon.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/danaseq-illumina-amplicon

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      # Resolve papa2's HEAD so the pip layer's cache key moves when it does.
      # envs/python.yml installs papa2 from a git URL; without a build arg that
      # changes, the layer stays valid forever and the image silently keeps
      # whatever it first installed.
      - name: Resolve upstream dependency HEAD
        id: deps
        run: |
          sha=$(git ls-remote https://github.com/rec3141/papa2.git HEAD | cut -f1)
          echo "papa2_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "  papa2 -> $sha"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: illumina_amplicon
          file: illumina_amplicon/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image so a run launched from the .sif can report what
          # it is. The image tag already carries the SHA, but nothing inside can
          # read it — without these the Dockerfile's ARG defaults win and every
          # run records commit_id "unknown".
          build-args: |
            PAPA2_SHA=${{ steps.deps.outputs.papa2_sha }}
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
