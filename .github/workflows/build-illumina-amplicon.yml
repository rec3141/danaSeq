name: Build illumina_amplicon image

on:
  push:
    branches: [main]
    paths:
      - 'illumina_amplicon/**'
      # envs/ IS a build input here: python.yml pins papa2 by SHA, so an env
      # change must rebuild. Prose lives in the site's docs/, not in the stage.
      - '!illumina_amplicon/README.md'
      - '.github/workflows/build-illumina-amplicon.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/danaseq-illumina-amplicon

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ github.sha }}

      # Resolve papa2's HEAD so the pip layer's cache key moves when it does.
      # envs/python.yml installs papa2 from a git URL; without a build arg that
      # changes, the layer stays valid forever and the image silently keeps
      # whatever it first installed.
      - name: Resolve upstream dependency HEAD and stamp build time
        id: deps
        run: |
          sha=$(git ls-remote https://github.com/rec3141/papa2.git HEAD | cut -f1)
          echo "papa2_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "  papa2 -> $sha"
          # Stamp the clock, not github.event.repository.updated_at — that is
          # repo metadata and lags the build by days, so it was recording a
          # build date the image never had.
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: illumina_amplicon
          file: illumina_amplicon/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image so a run launched from the .sif can report what
          # it is. The image tag already carries the SHA, but nothing inside can
          # read it — without these the Dockerfile's ARG defaults win and every
          # run records commit_id "unknown".
          build-args: |
            PAPA2_SHA=${{ steps.deps.outputs.papa2_sha }}
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_DATE=${{ steps.deps.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The pipeline is only compiled when Nextflow parses it, which until now
      # first happened on a cluster, at a node allocation. A Groovy syntax error
      # in a module therefore shipped as :latest, the clusters auto-pulled it,
      # and the run died in 11 seconds having submitted nothing. The image's
      # default CMD is `run /pipeline/main.nf --help`, so this is the whole
      # check. Production sets the legacy parser; match it or the test passes on
      # a grammar the runs do not use.
      - name: Smoke test - the pipeline compiles
        run: |
          docker run --rm -e NXF_SYNTAX_PARSER=v1 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      # Only now does :latest move. A failed smoke test leaves it on the last
      # image that passed, rather than on one that cannot start.
      - name: Promote to latest
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
