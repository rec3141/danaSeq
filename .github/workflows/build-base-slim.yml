name: Build slim base image (merged envs)

on:
  # Base inputs must trigger this build. build-mag-analysis.yml deliberately
  # excludes them from its own paths, so without this a change to the envs or
  # to Dockerfile.base-slim rebuilt nothing until someone dispatched by hand.
  push:
    branches: [main]
    paths:
      - 'mag_analysis/Dockerfile.base-slim'
      - 'mag_analysis/envs/**'
      - 'mag_analysis/docker/**'
      - '.github/workflows/build-base-slim.yml'
  workflow_dispatch:

# One build of the base at a time, in the order queued (see build-assembly-base.yml).
concurrency:
  group: image-danaseq-mag-base-slim
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # cpu and cuda builds of the same Dockerfile (TORCH_VARIANT); the cuda one
  # is the base of danaseq-mag-analysis-gpu.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            image: danaseq-mag-base-slim
          - variant: cuda
            image: danaseq-mag-base-slim-gpu
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/${{ matrix.image }}

    steps:
      - name: Maximize build disk space
        uses: easimon/maximize-build-space@v10
        with:
          build-mount-path: /var/lib/docker
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Restart Docker daemon
        run: sudo systemctl restart docker

      - name: Check available disk space
        run: df -h / /var/lib/docker

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: mag_analysis
          file: mag_analysis/Dockerfile.base-slim
          build-args: |
            TORCH_VARIANT=${{ matrix.variant }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # Rebuild the leaf over the base this run just published, as
  # build-assembly-base.yml does for its leaves.
  mag-analysis:
    needs: build
    permissions:
      # write, not read: the called workflow calls publish-sif.yml, which
      # pushes the SIF and records the promoted digest to deploy/<image>.json.
      # A called workflow cannot hold more permission than its caller grants,
      # at any depth, and granting less fails the whole run at startup.
      contents: write
      packages: write
    uses: ./.github/workflows/build-mag-analysis.yml
