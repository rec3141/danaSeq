name: Build illumina_rna image

on:
  push:
    branches: [main]
    paths:
      - 'illumina_rna/**'
      - '!illumina_rna/conda-envs/**'
      - '!illumina_rna/envs/**'
      - '.github/workflows/build-illumina-rna.yml'
  workflow_dispatch:
  workflow_call:

# One build of an image at a time, in the order they were queued. A commit that
# touches Dockerfile.base and a leaf together queues the leaf's own push build
# and, once the base finishes, the base's rebuild of that leaf — both pushing
# :latest. Without this the tag is whichever finished last, and the push build
# is the faster of the two, so the stale one can win.
concurrency:
  group: image-danaseq-illumina-rna
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/danaseq-illumina-rna

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: illumina_rna
          file: illumina_rna/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The pipeline is only compiled when Nextflow parses it, which until now
      # first happened on a cluster, at a node allocation. A Groovy syntax error
      # in a module therefore shipped as :latest, the clusters auto-pulled it,
      # and the run died in 11 seconds having submitted nothing. The image's
      # default CMD is `run /pipeline/main.nf --help`, so this is the whole
      # check. Production sets the legacy parser; match it or the test passes on
      # a grammar the runs do not use.
      - name: Smoke test - the pipeline compiles
        run: |
          docker run --rm -e NXF_SYNTAX_PARSER=v1 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      # Only now does :latest move. A failed smoke test leaves it on the last
      # image that passed, rather than on one that cannot start.
      - name: Promote to latest
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
