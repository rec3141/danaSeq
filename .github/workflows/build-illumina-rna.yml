name: Build illumina_rna image

on:
  push:
    branches: [main]
    paths:
      - 'illumina_rna/**'
      - '!illumina_rna/conda-envs/**'
      - '!illumina_rna/envs/**'
      - '.github/workflows/build-illumina-rna.yml'
  workflow_dispatch:
  workflow_call:

# One build of an image at a time, in the order they were queued. A commit that
# touches Dockerfile.base and a leaf together queues the leaf's own push build
# and, once the base finishes, the base's rebuild of that leaf — both pushing
# :latest. Without this the tag is whichever finished last, and the push build
# is the faster of the two, so the stale one can win.
concurrency:
  group: image-danaseq-illumina-rna
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/danaseq-illumina-rna

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
      digest: ${{ steps.promote.outputs.digest }}
      base_digest: ${{ steps.base.outputs.digest }}
      build_date: ${{ steps.stamp.outputs.build_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Which base we are about to build on. Recorded in the tag and re-checked
      # before promotion: this workflow runs both on its own push and again
      # chained from the base build, and those two produce different images from
      # the same commit.
      - name: Resolve base image digest
        id: base
        run: |
          d=$(docker buildx imagetools inspect \
                ghcr.io/${{ github.repository_owner }}/danaseq-assembly-base:latest \
                --format '{{.Manifest.Digest}}')
          short=${d#sha256:}
          # An empty digest here silently produced the tag "<sha>-" (trailing
          # separator, no base), which pushed fine and then failed the smoke
          # test with an image-not-found. Fail here instead, where the cause
          # is legible.
          if [ -z "$short" ]; then
            echo "could not resolve danaseq-assembly-base:latest digest" >&2
            exit 1
          fi
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "short=${short:0:12}" >> "$GITHUB_OUTPUT"
          echo "base is $d"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ github.sha }}-${{ steps.base.outputs.short }}

      - name: Stamp build time
        id: stamp
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: illumina_rna
          file: illumina_rna/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nextflow compiles the pipeline only when it parses it, so without this a
      # Groovy syntax error would first surface on a cluster, after a node
      # allocation, in an image the clusters had already auto-pulled. The image's
      # default CMD is `run /pipeline/main.nf --help`, so this is the whole
      # check. Production sets the legacy parser; match it or the test passes on
      # a grammar the runs do not use.
      - name: Smoke test - the pipeline compiles
        run: |
          docker run --rm -e NXF_SYNTAX_PARSER=v1 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ steps.base.outputs.short }}"

      # Only now does :latest move. A failed smoke test leaves it on the last
      # image that passed, rather than on one that cannot start.
      # Only promote if the base we built on is still current. Otherwise this is
      # the stale-base run of a commit that also changed Dockerfile.base, and
      # publishing it would ship a new git SHA over old base contents. The
      # chained build promotes.
      - name: Promote to latest
        id: promote
        run: |
          now=$(docker buildx imagetools inspect \
                  ghcr.io/${{ github.repository_owner }}/danaseq-assembly-base:latest \
                  --format '{{.Manifest.Digest}}')
          if [ "$now" != "${{ steps.base.outputs.digest }}" ]; then
            echo "base moved during this build; not promoting"
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          src="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ steps.base.outputs.short }}"
          docker buildx imagetools create -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" "$src"
          digest=$(docker buildx imagetools inspect "$src" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "promoted=true" >> "$GITHUB_OUTPUT"

  # A ready-made SIF of the promoted image and the deploy record that pins the
  # clusters to it. Only for a build that promoted: one that stood down because
  # its base moved did not produce the deployed image.
  publish:
    needs: build
    if: needs.build.outputs.promoted == 'true'
    permissions:
      # publish-sif.yml pushes the deploy record and the SIF. A called workflow
      # cannot hold more than its caller grants, so build-assembly-base.yml
      # grants the same to its call of this workflow.
      contents: write
      packages: write
    uses: ./.github/workflows/publish-sif.yml
    with:
      image: danaseq-illumina-rna
      digest: ${{ needs.build.outputs.digest }}
      base_digest: ${{ needs.build.outputs.base_digest }}
      build_date: ${{ needs.build.outputs.build_date }}
