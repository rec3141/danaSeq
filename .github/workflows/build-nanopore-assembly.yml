name: Build nanopore_assembly image

on:
  push:
    branches: [main]
    paths:
      - 'nanopore_assembly/**'
      - '!nanopore_assembly/conda-envs/**'
      - '!nanopore_assembly/envs/**'
      # the base build rebuilds this image once the new base exists
      - '!nanopore_assembly/Dockerfile.base'
      - '!nanopore_assembly/Dockerfile.base-slim'
      - '.github/workflows/build-nanopore-assembly.yml'
  workflow_dispatch:
  workflow_call:

# One build of an image at a time, in the order they were queued. A commit that
# touches Dockerfile.base and a leaf together queues the leaf's own push build
# and, once the base finishes, the base's rebuild of that leaf — both pushing
# :latest. Without this the tag is whichever finished last, and the push build
# is the faster of the two, so the stale one can win.
concurrency:
  group: image-danaseq-nanopore-assembly
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/danaseq-nanopore-assembly

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Stamp build time
        id: stamp
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: nanopore_assembly
          file: nanopore_assembly/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image so a run launched from the .sif can report what
          # it is. The image tag already carries the SHA, but nothing inside can
          # read it — without these the Dockerfile's ARG defaults win and every
          # run records commit_id "unknown".
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
