name: Tests

# Small local regressions only (tests/): compile fastq_filter from source and
# run it on synthetic reads; run the MetaCyc scorer on its hand-made fixture;
# run the nanopore_live completion-watcher against stand-in processes.
# No pipeline datasets are involved.

on:
  push:
    branches: [main]
    paths:
      - 'nanopore_assembly/bin/fastq_filter.cpp'
      - 'nanopore_assembly/modules/preprocess.nf'
      - 'mag_analysis/bin/metacyc_scorer.py'
      - 'mag_analysis/bin/metacyc_scorer/**'
      - 'mag_analysis/bin/parse_marferret_results.py'
      - 'nanopore_live/bin/watch_for_completion.sh'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'nanopore_assembly/bin/fastq_filter.cpp'
      - 'nanopore_assembly/modules/preprocess.nf'
      - 'mag_analysis/bin/metacyc_scorer.py'
      - 'mag_analysis/bin/metacyc_scorer/**'
      - 'mag_analysis/bin/parse_marferret_results.py'
      - 'nanopore_live/bin/watch_for_completion.sh'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  nanopore-live-watcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run completion-watcher regression
        run: python3 tests/test_watch_for_completion.py -v

  marferret-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run MarFERReT result parser regression
        run: python3 tests/test_parse_marferret_results.py -v

  fastq-filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ zlib1g-dev

      - name: Run fastq_filter regressions
        run: python3 tests/test_fastq_filter.py -v

      - name: Run CONCAT_READS dedupe regressions
        run: python3 tests/test_concat_reads_dedupe.py -v

  metacyc-scorer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run MetaCyc scorer tests
        run: python3 tests/test_metacyc_scorer.py -v

      - name: Run MetaCyc benchmark tool tests
        run: python3 tests/test_metacyc_benchmark.py -v

      # setup_metacyc and the scorer run on the host python3, which is 3.6 on
      # Grex (RHEL 8), so keep them working there.
      - name: Run MetaCyc scorer tests on Python 3.6
        run: docker run --rm -v "$PWD":/src -w /src python:3.6-slim python tests/test_metacyc_scorer.py -v
