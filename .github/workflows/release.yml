name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since $PREV_TAG" > changelog.md
            git log --oneline "$PREV_TAG"..HEAD | sed 's/^/- /' >> changelog.md
          else
            echo "Initial release" > changelog.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.md

  # ── Base images (built first) ─────────────────────────────────────────
  bases:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: danaseq-assembly-base
            context: nanopore_assembly
            dockerfile: nanopore_assembly/Dockerfile.base
            timeout: 30
            large: false
          # cpu and cuda builds of the same Dockerfile (TORCH_VARIANT), as in
          # build-base-slim.yml; the cuda one is the base of danaseq-mag-analysis-gpu.
          - name: danaseq-mag-base-slim
            context: mag_analysis
            dockerfile: mag_analysis/Dockerfile.base-slim
            timeout: 350
            large: true
            torch_variant: cpu
          - name: danaseq-mag-base-slim-gpu
            context: mag_analysis
            dockerfile: mag_analysis/Dockerfile.base-slim
            timeout: 350
            large: true
            torch_variant: cuda
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Maximize build space
        if: matrix.large
        uses: easimon/maximize-build-space@v10
        with:
          build-mount-path: /var/lib/docker
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
      - name: Restart Docker daemon
        if: matrix.large
        run: sudo systemctl restart docker
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.torch_variant && format('TORCH_VARIANT={0}', matrix.torch_variant) || '' }}

  # ── Pipeline images (after bases) ─────────────────────────────────────
  pipelines:
    needs: bases
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: danaseq-nanopore-assembly
            context: nanopore_assembly
            dockerfile: nanopore_assembly/Dockerfile
            timeout: 15
            large: false
          - name: danaseq-illumina-assembly
            context: illumina_assembly
            dockerfile: illumina_assembly/Dockerfile
            timeout: 15
            large: false
          - name: danaseq-illumina-rna
            context: illumina_rna
            dockerfile: illumina_rna/Dockerfile
            timeout: 45
            large: false
          - name: danaseq-illumina-amplicon
            context: illumina_amplicon
            dockerfile: illumina_amplicon/Dockerfile
            timeout: 60
            large: false
          # Two variants from the same Dockerfile, as in build-mag-analysis.yml:
          # the gpu one sits on the base built with CUDA PyTorch.
          - name: danaseq-mag-analysis
            context: mag_analysis
            dockerfile: mag_analysis/Dockerfile
            timeout: 60
            large: true
            base: danaseq-mag-base-slim
          - name: danaseq-mag-analysis-gpu
            context: mag_analysis
            dockerfile: mag_analysis/Dockerfile
            timeout: 60
            large: true
            base: danaseq-mag-base-slim-gpu
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Maximize build space
        if: matrix.large
        uses: easimon/maximize-build-space@v10
        with:
          build-mount-path: /var/lib/docker
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
      - name: Restart Docker daemon
        if: matrix.large
        run: sudo systemctl restart docker
      # submodules: mag_analysis/ecossdb is a submodule; without it the
      # mag_analysis image ships without ECOSSDB (build-mag-analysis.yml does the same).
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha,prefix=
      - name: Stamp build time
        id: stamp
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # The image is built from mag_analysis/ alone; viz/deploy.sh (the
      # microscape.app deploy hook's target) needs the shared deployer beside it.
      - name: Stage shared deploy tool
        if: matrix.context == 'mag_analysis'
        run: cp tools/microscape_deploy.sh mag_analysis/viz/microscape_deploy.sh
      # Resolve papa2's HEAD so the pip layer's cache key moves when it does
      # (see build-illumina-amplicon.yml).
      - name: Resolve upstream dependency HEAD
        id: papa2
        if: matrix.context == 'illumina_amplicon'
        run: echo "sha=$(git ls-remote https://github.com/rec3141/papa2.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image so a run launched from the .sif can report what
          # it is. The image tag already carries the SHA, but nothing inside can
          # read it — without these the Dockerfile's ARG defaults win and every
          # run records commit_id "unknown".
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            ${{ matrix.base && format('BASE_IMAGE=ghcr.io/{0}/{1}:latest', github.repository_owner, matrix.base) || '' }}
            ${{ steps.papa2.outputs.sha && format('PAPA2_SHA={0}', steps.papa2.outputs.sha) || '' }}

  # ── nanopore_live (independent, no base) ──────────────────────────────
  nanopore-live:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          build-mount-path: /var/lib/docker
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
      - name: Restart Docker daemon
        run: sudo systemctl restart docker
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/danaseq-live
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha,prefix=
      - name: Stamp build time
        id: stamp
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: nanopore_live
          file: nanopore_live/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image so a run launched from the .sif can report what
          # it is (see build-nanopore-live.yml).
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
