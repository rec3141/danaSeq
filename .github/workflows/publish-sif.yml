name: Publish SIF and deploy record

# Called by each image workflow once its image is promoted to :latest.
#
# Builds a ready-made SIF of the promoted digest and publishes it to GHCR as an
# ORAS artifact beside the image (oras://ghcr.io/<owner>/<image>:sif-<sha>), in
# the same package, so it has the image's visibility. Clusters then download
# the SIF instead of each converting the image with mksquashfs, which on grex
# is killed: it sizes its caches from the node's memory, not the job's limit.
# Then records the digest (and SIF) in deploy/<image>.json, which omc-pickup
# reads to pin each cluster to an exact image.
#
# This runs on its own runner because unpacking and squashing the image needs
# more disk than a build job has left.
#
# Required caller permissions (a called workflow cannot hold more than its
# caller grants, and granting less fails the run at startup):
#   contents: write   -- record-deploy.sh pushes deploy/<image>.json
#   packages: write   -- apptainer push to the image's GHCR package
# A caller that is itself called must be granted the same by its own caller.

on:
  workflow_call:
    inputs:
      image:
        description: Image name without owner, e.g. danaseq-nanopore-assembly. Also names deploy/<image>.json.
        required: true
        type: string
      digest:
        description: Manifest digest that was promoted to :latest (sha256:...).
        required: true
        type: string
      build_date:
        description: Build timestamp recorded as "built".
        required: false
        type: string
        default: ''
      base_digest:
        description: Digest of the base image the image was built on, recorded as "base_digest".
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ inputs.image }}

jobs:
  sif:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      # An empty or malformed digest would be written into the deploy record
      # and pin every cluster to nothing.
      - name: Check inputs
        run: |
          case "${{ inputs.digest }}" in
            sha256:*) ;;
            *) echo "digest input is not a sha256 digest: '${{ inputs.digest }}'" >&2; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      # A failure here must not block the deploy record: without SIF fields
      # the clusters fall back to building from the image.
      - name: Build and push SIF
        id: sif
        continue-on-error: true
        run: |
          apptainer build image.sif "docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.digest }}"
          sha=$(sha256sum image.sif | cut -d' ' -f1)
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
              --username "${{ github.actor }}" --password-stdin oras://${{ env.REGISTRY }}
          ref="oras://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sif-${{ github.sha }}"
          apptainer push image.sif "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          ls -la image.sif

      # The deployable digest (and SIF), in version control. Clusters pin to
      # this rather than resolving :latest themselves, so a pull that starts
      # just before a new publish still lands exactly the image it asked for:
      # a digest is immutable, a tag is not.
      - name: Record deployed digest
        env:
          SIF_REF: ${{ steps.sif.outputs.ref }}
          SIF_SHA256: ${{ steps.sif.outputs.sha256 }}
        run: >
          bash .github/scripts/record-deploy.sh "${{ inputs.image }}"
          "${{ inputs.digest }}"
          "${{ inputs.base_digest }}"
          "${{ inputs.build_date }}"
