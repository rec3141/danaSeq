name: Build nanopore_live image

on:
  push:
    branches: [main]
    paths:
      - 'nanopore_live/**'
      - '!nanopore_live/conda-envs/**'
      - '.github/workflows/build-nanopore-live.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/danaseq-live

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          build-mount-path: /var/lib/docker
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Restart Docker daemon
        run: sudo systemctl restart docker

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ github.sha }}

      - name: Stamp build time
        id: stamp
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: nanopore_live
          file: nanopore_live/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image so a run launched from the .sif can report what
          # it is. The image tag already carries the SHA, but nothing inside can
          # read it — without these the Dockerfile's ARG defaults win and every
          # run records commit_id "unknown".
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}

      # Nextflow compiles the pipeline only when it parses it, so without this a
      # Groovy syntax error would first surface on a cluster, after a node
      # allocation, in an image the clusters had already auto-pulled. The image's
      # default CMD is `run /pipeline/main.nf --help`, so this is the whole
      # check. Production sets the legacy parser; match it or the test passes on
      # a grammar the runs do not use.
      - name: Smoke test - the pipeline compiles
        run: |
          docker run --rm -e NXF_SYNTAX_PARSER=v1 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      # Only now does :latest move. A failed smoke test leaves it on the last
      # image that passed, rather than on one that cannot start.
      - name: Promote to latest
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
