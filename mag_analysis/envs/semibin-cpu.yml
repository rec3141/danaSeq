name: dana-mag-semibin
channels:
  - conda-forge
  - bioconda
dependencies:
  - semibin=2.1.0
  - pytorch-cpu           # CPU-only PyTorch (~500MB vs ~5GB for GPU)
  - biopython             # LorBin dependency (hmmer, prodigal, bedtools already in SemiBin2)
  - pip:
    - lorbin @ git+https://github.com/rec3141/LorBin.git@907d4238144b390e33b7f8ba0b22b1f16eaeb977
